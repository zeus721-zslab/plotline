# 운영 web 컨테이너 nginx 설정 (gateway → 이 서버 1곳으로 들어온다. D-13)

# gateway 가 보낸 X-Forwarded-Proto(https)를 유지하고, 없을 때만 이 서버의 scheme 을 쓴다.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 발행 JSON 은 발행 직후 반영되도록 매 요청 재검증. 값이 비면 헤더를 붙이지 않는다.
map $uri $published_cache_control {
    default    "";
    ~*\.json$  "no-cache";
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;

    # add_header 는 하위 location 에서 add_header 를 쓰면 상속되지 않으므로 해당 location 에 다시 적는다.
    add_header X-Content-Type-Options "nosniff" always;
    # no-referrer로 바꾸면 동일 출처 POST의 Origin이 null이 되어 관리자 요청이 403
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        # 변수 방식 proxy_pass: 기동 시점에 api 이름 해석을 요구하지 않아 api 가 내려가 있어도 nginx 가 뜬다.
        # 변수에 URI 가 없으므로 요청 URI(/api/...)가 그대로 전달된다.
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://plotline-api:8000;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /data/ {
        # 발행 볼륨(published, 읽기 전용 마운트). D-14
        alias /srv/published/;
        autoindex off;

        add_header Cache-Control $published_cache_control;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /admin {
        # 관리자 화면은 프리렌더하지 않으므로 SPA fallback
        try_files $uri $uri/ /200.html;
    }

    location /_app/immutable/ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # trailingSlash 기본값(never) 프리렌더 산출은 /about → about.html, 루트는 index.html
        try_files $uri $uri.html $uri/index.html =404;
    }
}
