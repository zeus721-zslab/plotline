name: PR CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit test
        run: node --test "src/**/*.test.ts"

      - name: Build
        run: pnpm build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:10.11
        # CI 일회용 컨테이너 전용 값이다. 시크릿 아님(운영·개발 DB 와 무관).
        env:
          MARIADB_DATABASE: plotline_test
          MARIADB_USER: plotline_test
          MARIADB_PASSWORD: plotline_test_password
          MARIADB_ROOT_PASSWORD: plotline_test_root_password
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # db 테스트 접속 정보. 위 서비스와 같은 CI 전용 값이다(시크릿 아님).
    env:
      DB_NAME: plotline_test
      DB_USER: plotline_test
      DB_PASSWORD: plotline_test_password
      DB_PORT: 3306
      TEST_DB_HOST: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.23
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Setup Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest --durations=10
